<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C3 Sync Knot — Production Assets</title>
<style>
  body { margin:0; padding:40px; background:#f4f4f2; font-family:Arial,sans-serif; }
  h1 { font-size:20px; letter-spacing:2px; margin:0 0 24px; }
  .row { display:flex; gap:20px; margin-bottom:20px; align-items:center; flex-wrap:wrap; }
  .swatch { padding:24px 28px; border-radius:6px; border:1px solid #d8d8d4; }
  .light { background:#fff; }
  .dark { background:#111; }
  .label { font-size:11px; letter-spacing:1px; text-transform:uppercase; margin-bottom:12px; color:#888; }
  .dark .label { color:#999; }
</style>
</head>
<body>
<h1>C3 Sync Knot — Final Assets</h1>

<div class="row">
  <div class="swatch light">
    <div class="label">c3-wordmark-light.svg</div>
    <img src="assets/c3-wordmark-light.svg" alt="C3 wordmark light" style="height:36px;">
  </div>
  <div class="swatch dark">
    <div class="label">c3-wordmark-dark.svg</div>
    <img src="assets/c3-wordmark-dark.svg" alt="C3 wordmark dark" style="height:36px;">
  </div>
</div>

<div class="row">
  <div class="swatch light">
    <div class="label">c3-icon.svg (32px)</div>
    <img src="assets/c3-icon.svg" alt="C3 icon" style="height:32px;">
  </div>
  <div class="swatch dark">
    <div class="label">c3-icon-dark.svg (32px)</div>
    <img src="assets/c3-icon-dark.svg" alt="C3 icon dark" style="height:32px;">
  </div>
</div>

<div class="row">
  <div class="swatch light">
    <div class="label">c3-icon.svg (16px)</div>
    <img src="assets/c3-icon.svg" alt="C3 icon 16px" style="height:16px;">
  </div>
  <div class="swatch dark">
    <div class="label">c3-icon-dark.svg (16px)</div>
    <img src="assets/c3-icon-dark.svg" alt="C3 icon dark 16px" style="height:16px;">
  </div>
</div>

</body>
</html>
