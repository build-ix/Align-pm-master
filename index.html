  <style>
    html,body{background:#0a0a12;margin:0;color:#e0e0e0}
    html[data-theme="light"]{background:#f5f5f5;color:#111}
    /* Drafting-paper grid pattern — renders instantly, hides black flash on reload */
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:
        linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
      background-size:40px 40px;
    }
    html[data-theme="light"] body::before{
      background:
        linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px);
      background-size:40px 40px;
    }
  </style>

  <link rel="icon" type="image/png" href="/favicon-v2.png" />
  <script>
    // Apply saved theme before paint (prevents flash)
    var t = localStorage.getItem('align-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);

    // iOS pull-to-refresh restores page from bfcache with stale body state.
    // body.section-open hides the dashboard and locks scroll → black screen.
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) {
        document.body.style.overflow = '';
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.width = '';
        document.body.style.touchAction = '';
        document.body.style.overscrollBehavior = '';
        document.body.classList.remove('section-open', 'ps-open');
      }
    });

    // ── Scroll position persistence ───────────────────────────────────────────────
    (function(){
      var KEY = 'align_scroll_y';
      // Save on every scroll (throttled)
      var lastY = 0, t;
      window.addEventListener('scroll', function(){
        lastY = window.scrollY || window.pageYOffset || 0;
        clearTimeout(t);
        t = setTimeout(function(){ try{ sessionStorage.setItem(KEY, String(lastY)); }catch(e){} }, 100);
      }, {passive:true});
      // Also save immediately when leaving
      window.addEventListener('pagehide', function(){
        try{ sessionStorage.setItem(KEY, String(window.scrollY || window.pageYOffset || 0)); }catch(e){}
      });
      // Restore after DOM settles
      var saved = sessionStorage.getItem(KEY);
      if(saved !== null){
        var target = parseInt(saved, 10) || 0;
        function tryRestore(){
          var h = document.documentElement.scrollHeight || document.body.scrollHeight || 0;
          if(h > window.innerHeight * 1.2){
            window.scrollTo(0, target);
            sessionStorage.removeItem(KEY);
          } else {
            setTimeout(tryRestore, 50);
          }
        }
        if(document.readyState === 'complete'){ tryRestore(); }
        else { window.addEventListener('load', tryRestore); }
      }
    })();
  </script>
