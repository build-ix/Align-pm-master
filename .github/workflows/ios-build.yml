name: Build iOS App

on:
  push:
    branches: [ios-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Capacitor (iOS-only deps, skip server)
        run: |
          npm install \
            @capacitor/core@^8.4.1 \
            @capacitor/cli@^8.4.1 \
            @capacitor/ios@^8.4.1 \
            @capacitor/camera@^8.2.1 \
            @capacitor/filesystem@^8.1.2 \
            @capacitor/haptics@^8.0.2 \
            @capacitor/push-notifications@^8.1.1 \
            @capacitor/splash-screen@^8.0.1 \
            @capacitor/status-bar@^8.0.2 \
            @capacitor/assets

      - name: Generate native iOS project
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Write export options
        run: |
          cat > ios/App/exportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Generate app icon assets
        run: |
          npx capacitor-assets generate \
            --iconBackgroundColor '#0a0a12' \
            --iconBackgroundColorDark '#0a0a12' \
            --assetPath assets/

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Import distribution certificate
        run: |
          echo "=== Extract cert and key ==="
          openssl pkcs12 -in .github/certs/distribution.p12 -passin pass:align123 -clcerts -nokeys | openssl x509 -out /tmp/cert.pem
          openssl pkcs12 -in .github/certs/distribution.p12 -passin pass:align123 -nocerts -nodes | openssl rsa -out /tmp/key.pem
          echo "=== Setup keychain ==="
          security create-keychain -p temp123 signing.keychain
          security default-keychain -s signing.keychain
          security unlock-keychain -p temp123 signing.keychain
          echo "=== Import cert ==="
          security import /tmp/cert.pem -k signing.keychain -T /usr/bin/codesign -T /usr/bin/xcodebuild
          echo "=== Import key ==="
          security import /tmp/key.pem -k signing.keychain -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple: -s -k temp123 signing.keychain
          rm /tmp/cert.pem /tmp/key.pem

      - name: Build and archive
        run: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Auto \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            -allowProvisioningUpdates \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Create distribution profile (fastlane sigh)
        run: |
          export SPACESHIP_CONNECT_API_KEY_ID="${{ secrets.APP_STORE_CONNECT_KEY_ID }}"
          export SPACESHIP_CONNECT_API_ISSUER_ID="${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
          export SPACESHIP_CONNECT_API_KEY_FILEPATH=~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          fastlane sigh \
            --app_identifier "net.alignprojects.app" \
            --filename "/tmp/align-distribution.mobileprovision" \
            --platform "ios" \
            --readonly true \
            --force

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/align-distribution.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Export .ipa
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath ./build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ./build

      - name: Upload to App Store Connect
        run: |
          xcrun altool --upload-app \
            -f ios/App/build/App.ipa \
            -t ios \
            -u "${{ secrets.APPLE_ID }}" \
            -p "${{ secrets.APPLE_APP_PASSWORD }}"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Align-PM.ipa
          path: ios/App/build/App.ipa
